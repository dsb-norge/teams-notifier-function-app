name: Microsoft Security DevOps

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '30 6 * * 1' # Monday 06:30 UTC

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  # Skip scans for docs- or CI-only changes. dorny/paths-filter returns
  # all filters as `true` for schedule events, so the weekly Monday cron
  # run still scans everything regardless of file paths.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      scannable: ${{ steps.filter.outputs.scannable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 2026-07-17
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3 2026-08-05
        id: filter
        with:
          filters: |
            scannable:
              - 'src/**'
              - 'tests/**'
              - '**/*.csproj'
              - 'global.json'
              - '.github/workflows/msdo.yml'

  msdo-source:
    name: Source & Dependency Scan
    needs: changes
    if: needs.changes.outputs.scannable == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 2026-07-17

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6 2026-07-16
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Build (generates .deps.json for Trivy)
        run: dotnet build -c Release --nologo -v quiet -warnAsMessage:xUnit1051

      - name: Run MSDO (Trivy)
        id: msdo
        uses: microsoft/security-devops-action@5b26a185ff02cf7c100778adeff0ebbf704ca144 # v1 2024-11-08
        with:
          tools: trivy

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4 2026-08-13
        if: always()
        with:
          sarif_file: ${{ steps.msdo.outputs.sarifFile }}
          category: msdo-trivy

  msdo-binaries:
    name: Binary Scan (BinSkim)
    needs: changes
    if: (github.event_name == 'push' || github.event_name == 'schedule') && needs.changes.outputs.scannable == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 2026-07-17

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6 2026-07-16
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Publish (R2R, linux-x64)
        run: dotnet publish src/TeamsNotificationBot -c Release -r linux-x64 -o ./publish

      - name: Run MSDO (BinSkim)
        id: msdo
        uses: microsoft/security-devops-action@5b26a185ff02cf7c100778adeff0ebbf704ca144 # v1 2024-11-08
        with:
          tools: binskim
        env:
          BINSKIM_TARGETS: ./publish/*.dll

      - name: Merge SARIF runs
        if: always()
        run: |
          # BinSkim produces multiple SARIF runs (one per DLL). CodeQL upload-sarif@v4
          # rejects files with multiple runs sharing the same category. Merge all runs
          # into a single run by concatenating their results arrays, while preserving
          # all other run-level metadata from the first run.
          jq '
            . as $root
            | (
                $root.runs[0]
                | .results = [ $root.runs[].results // [] | .[] ]
              ) as $mergedRun
            | $root
            | .runs = [ $mergedRun ]
          ' "${{ steps.msdo.outputs.sarifFile }}" > /tmp/merged-binskim.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4 2026-08-13
        if: always()
        with:
          sarif_file: /tmp/merged-binskim.sarif
          category: msdo-binskim
