name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5 2026-05-18
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-artifacts:
    name: Build Release Artifacts
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      # The attestations below name the commit this run started from, and the deploy workflow
      # takes a release only when that is the tag's commit. When GitHub drops the push event of
      # the release PR's merge, release-please creates the release on the next push instead, for
      # the older release commit: artifacts attested here would name the wrong commit, and every
      # deploy would refuse them. Fail instead, so nothing undeployable is published.
      - name: Check that this run started from the release commit
        env:
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [ "${RELEASE_SHA}" != "${GITHUB_SHA}" ]; then
            echo "::error::release-please created ${TAG_NAME} at ${RELEASE_SHA}, but this run started from ${GITHUB_SHA}: the release merge's own run never happened. Artifacts attested here would name ${GITHUB_SHA}, which the deploy workflow refuses, so none are published. Cut the next release instead; see docs/contributing.md, Versioning and Releases."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 2026-07-17
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Build release artifacts
        uses: ./.github/actions/build-release-artifacts
        with:
          version: ${{ env.VERSION }}

      # Attested in the same job: this builds a release-please tag on main,
      # i.e. reviewed code. prerelease.yml attests in a separate job instead.
      - name: Attest function app ZIP
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2 2026-08-06
        with:
          subject-path: teams-notifier-function-app-v${{ env.VERSION }}.zip

      - name: Attest app-requirements.json
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2 2026-08-06
        with:
          subject-path: app-requirements.json

      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            "teams-notifier-function-app-v${VERSION}.zip" \
            "app-requirements.json" \
            "teams-app-package-v${VERSION}.tar.gz" \
            --clobber
