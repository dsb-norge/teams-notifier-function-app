name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5 2026-05-18
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-artifacts:
    name: Build Release Artifacts
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6 2026-01-09
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5 2026-02-26
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Publish function app
        run: |
          dotnet publish src/TeamsNotificationBot \
            -c Release -r linux-x64 -o ./publish \
            -p:Version=$VERSION

      - name: Create release artifacts
        run: |
          cd publish && zip -r ../teams-notifier-function-app-v${VERSION}.zip . && cd ..
          cp src/TeamsNotificationBot/app-requirements.json ./app-requirements.json
          tar czf teams-app-package-v${VERSION}.tar.gz -C teams-app-package .

      - name: Attest function app ZIP
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0 2026-02-26
        with:
          subject-path: teams-notifier-function-app-v${{ env.VERSION }}.zip

      - name: Attest app-requirements.json
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0 2026-02-26
        with:
          subject-path: app-requirements.json

      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            "teams-notifier-function-app-v${VERSION}.zip" \
            "app-requirements.json" \
            "teams-app-package-v${VERSION}.tar.gz" \
            --clobber
