name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # Detect which buckets of files changed in the push / PR. Sibling jobs gate
  # their `if:` on these outputs so we don't waste minutes building, scanning
  # dependencies, or regenerating requirements for a docs- or CI-only change.
  # The `conclusion` job below stays gated on `if: always()` and treats
  # skipped sibling jobs as success, so the required status check is still
  # reported regardless of which jobs ran.
  changes:
    name: Detect changes
    # paths-filter lists PR files through the API with the token it is
    # given (read is enough) and uses git on push; nothing here writes.
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      deps: ${{ steps.filter.outputs.deps }}
      requirements: ${{ steps.filter.outputs.requirements }}
      actions: ${{ steps.filter.outputs.actions }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 2026-07-17
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3 2026-08-05
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - '**/*.csproj'
              - 'global.json'
              - 'TeamsNotificationBot.slnx'
              - '.github/workflows/ci.yml'
            deps:
              - '**/*.csproj'
              - 'global.json'
              - 'scripts/deploy/requirements.txt'
              - '.github/workflows/ci.yml'
            requirements:
              - 'src/**'
              - 'scripts/generate-requirements.sh'
              - 'scripts/validate-requirements.sh'
              - 'teams-app-package/create-teams-app-package.sh'
              - 'teams-app-package/app-metadata.json'
              - 'scripts/deploy/lib.bash'
              - 'scripts/deploy/validate-manifest-schema.*'
              - 'scripts/deploy/requirements.txt'
              - '.github/workflows/ci.yml'
            actions:
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.github/actionlint.yaml'
              - '.github/zizmor.yml'
            # Everything the Deploy Tooling job's tests read: the scripts, the workflow
            # that runs them, the release-please files, and the repository files the
            # tests use as fixtures.
            deploy:
              - 'scripts/deploy/**'
              - 'scripts/ci/**'
              - 'tests/deploy/**'
              - '.shellcheckrc'
              - '.github/workflows/reusable-deploy.yml'
              - '.github/workflows/ci.yml'
              - 'release-please-config.json'
              - '.release-please-manifest.json'
              - 'docs/deployment-guide.md'
              - 'teams-app-package/**'
              - 'src/TeamsNotificationBot/app-requirements.json'
              - 'src/TeamsNotificationBot/TeamsNotificationBot.csproj'

  build-and-test:
    name: Build and Test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Builds and runs the PR's code and tests. Results go out as workflow
    # commands (annotations, job summary), which need no token scope.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 2026-07-17
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6 2026-07-16
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Get npm global directory
        id: npm-global
        run: echo "dir=$(npm prefix -g)" >> "$GITHUB_OUTPUT"

      - name: Cache Azurite global install
        id: cache-azurite
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6 2026-06-23
        with:
          path: |
            ${{ steps.npm-global.outputs.dir }}/lib/node_modules/azurite
            ${{ steps.npm-global.outputs.dir }}/bin/azurite*
          key: azurite-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}

      # Azurite is intentionally not version-pinned — it floats on whatever
      # npm gives us. If a release breaks (typically: hasn't caught up to a
      # new storage API version used by the .NET SDK), pin here AND in
      # docs/local-development.md AND bake the version into the cache key
      # above together. See CLAUDE.md "Bumping dependencies".
      - name: Install Azurite
        if: steps.cache-azurite.outputs.cache-hit != 'true'
        run: npm install -g azurite

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release -warnAsMessage:xUnit1051

      - name: Test
        # MTP runner: args after `--` go to the test app. `--report-github` is the
        # MTP equivalent of the old `--logger GitHubActions`.
        run: dotnet test --no-build -c Release -- --report-github --report-github-summary-include-passed false

  dependency-review:
    name: Dependency Review
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 2026-07-17

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5 2026-05-18
        with:
          license-check: false

  validate:
    name: Validate Requirements
    needs: changes
    if: needs.changes.outputs.requirements == 'true'
    runs-on: ubuntu-latest
    steps:
      # Runs the PR's generate/validate scripts. Keep the token out of
      # .git/config so they can't read it; the PR-comment steps below get it
      # explicitly via GH_TOKEN.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 2026-07-17
        with:
          persist-credentials: false

      - name: Regenerate app-requirements.json
        run: bash scripts/generate-requirements.sh

      - name: Check for uncommitted changes
        id: diff-check
        run: |
          if ! git diff --exit-code src/TeamsNotificationBot/app-requirements.json; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            git diff src/TeamsNotificationBot/app-requirements.json > /tmp/requirements-diff.txt
            echo "::error::app-requirements.json is stale — see PR comment for details."
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "app-requirements.json is up to date."
          fi

      - name: Prepare PR comment if stale
        if: steps.diff-check.outputs.stale == 'true' && github.event_name == 'pull_request'
        run: |
          # The backticks below are Markdown for the comment, not shell expansions.
          # shellcheck disable=SC2016
          {
            echo '### :x: `app-requirements.json` is out of date'
            echo ''
            echo 'The committed file does not match what `generate-requirements.sh` produces from the current source code. This usually means you changed a queue name, route, auth role, command, or app version but forgot to regenerate.'
            echo ''
            echo '**To fix:**'
            echo '```bash'
            echo 'cd scripts'
            echo 'bash generate-requirements.sh'
            echo '```'
            echo 'Then commit the updated `src/TeamsNotificationBot/app-requirements.json`.'
            echo ''
            echo '<details>'
            echo '<summary>Diff (click to expand)</summary>'
            echo ''
            echo '```diff'
            cat /tmp/requirements-diff.txt
            echo '```'
            echo '</details>'
          } > /tmp/requirements-comment.md

      - name: Post PR comment if stale
        if: steps.diff-check.outputs.stale == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MARKER="<!-- requirements-check -->"
          PR=${{ github.event.pull_request.number }}
          BODY="$(printf '%s\n%s' "$MARKER" "$(cat /tmp/requirements-comment.md)")"
          COMMENT_ID=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --paginate --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -1)
          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" -X PATCH -f body="$BODY"
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$BODY"
          fi

      - name: Remove stale comment if passing
        if: steps.diff-check.outputs.stale == 'false' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MARKER="<!-- requirements-check -->"
          PR=${{ github.event.pull_request.number }}
          COMMENT_ID=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --paginate --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -1)
          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" -X DELETE
          fi

      - name: Fail if stale
        if: steps.diff-check.outputs.stale == 'true'
        run: exit 1

      - name: Validate app-requirements.json
        run: bash scripts/validate-requirements.sh

      - name: Generate a sample Teams app manifest
        # Exercises create-teams-app-package.sh end-to-end with dummy GUIDs
        # so the next step can validate the resulting manifest.json against
        # the live Teams schema. Catches regressions in the script's jq
        # composition (e.g. drift from the schema's allowed properties)
        # before the release-please artifact ships them to consumers.
        run: |
          set -euo pipefail
          mkdir -p /tmp/manifest-ci
          bash teams-app-package/create-teams-app-package.sh \
            --bot-app-id   00000000-aaaa-aaaa-aaaa-aaaaaaaaaaaa \
            --teams-app-id 11111111-bbbb-bbbb-bbbb-bbbbbbbbbbbb \
            --output-dir   /tmp/manifest-ci \
            --dry-run

      - name: Validate the manifest against the Teams app schema
        # The same script, and the same hash-pinned jsonschema, that a deploy's
        # package-manifest job runs. It reads the schema URL from manifest.$schema, so a
        # schema bump in the generator is validated against whatever it now declares,
        # and an unknown property trips here before a bad ZIP reaches a Teams Admin upload.
        env:
          MANIFEST: /tmp/manifest-ci/manifest.json
        run: bash scripts/deploy/validate-manifest-schema.sh

  # Workflow and composite-action edits change the release path but touch none
  # of the code filters above, so without these two jobs they would merge with
  # every build skipped.
  lint-workflows:
    name: Lint Workflows
    needs: changes
    if: needs.changes.outputs.actions == 'true'
    # Runs code from the PR branch: don't hand it the workflow-level
    # pull-requests: write token.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      # Bump both together: the checksum is the linux_amd64 tarball's line in
      # the release's actionlint_<version>_checksums.txt.
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      # Bump both together: the checksum is GitHub's SHA-256 digest of the release asset
      # zizmor-x86_64-unknown-linux-gnu.tar.gz.
      ZIZMOR_VERSION: 1.30.1
      ZIZMOR_SHA256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 2026-07-17
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          set -euo pipefail
          TARBALL="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "/tmp/$TARBALL" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$TARBALL"
          echo "${ACTIONLINT_SHA256}  /tmp/$TARBALL" | sha256sum --check --strict
          tar -xzf "/tmp/$TARBALL" -C /tmp actionlint

      - name: Run actionlint
        # Also shellchecks every run: block (shellcheck ships on ubuntu-latest).
        # .github/actionlint.yaml holds its one, expiring, suppression.
        run: /tmp/actionlint -color

      - name: Install zizmor
        run: |
          set -euo pipefail
          TARBALL="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --retry 3 -o "/tmp/$TARBALL" \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/$TARBALL"
          echo "${ZIZMOR_SHA256}  /tmp/$TARBALL" | sha256sum --check --strict
          tar -xzf "/tmp/$TARBALL" -C /tmp zizmor

      - name: Run zizmor
        # Security audit (template injection, excessive permissions, credential
        # persistence, unpinned or impostor actions). The token enables its online audits,
        # which check that each pinned SHA belongs to the action's repository. It gates the
        # workflow other repositories run; the older workflows have findings of their own
        # and join the list as they are fixed. .github/zizmor.yml sets the policy.
        env:
          GH_TOKEN: ${{ github.token }}
        run: /tmp/zizmor --no-progress .github/workflows/reusable-deploy.yml

  # The scripts reusable-deploy.yml runs, and the workflow's structure. actionlint
  # shellchecks inline run: blocks only, so the scripts get their own shellcheck here.
  deploy-tooling:
    name: Deploy Tooling
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    # Runs code from the PR branch: don't hand it the workflow-level
    # pull-requests: write token.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      # tag@commit: the commit is what installs, and git verifies it
      # (scripts/ci/install-bats.sh). Bump both halves together.
      BATS_CORE_REF: v1.14.0@eb7f42f8d608ac693d7a4b67474f6714ea68cfc5
      # Bump both together: the checksum is GitHub's SHA-256 digest of the release asset
      # shfmt_v<version>_linux_amd64.
      SHFMT_VERSION: 3.14.1
      SHFMT_SHA256: 76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 2026-07-17
        with:
          persist-credentials: false

      - name: Install bats
        run: bash scripts/ci/install-bats.sh

      - name: Install shfmt
        run: |
          set -euo pipefail
          BINARY="shfmt_v${SHFMT_VERSION}_linux_amd64"
          curl -fsSL --retry 3 -o "/tmp/$BINARY" \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/$BINARY"
          echo "${SHFMT_SHA256}  /tmp/$BINARY" | sha256sum --check --strict
          install -m 0755 "/tmp/$BINARY" /tmp/shfmt

      - name: shellcheck
        # The runner image's shellcheck, as actionlint uses. .shellcheckrc lets it
        # follow `source` to scripts/deploy/lib.bash.
        run: |
          set -euo pipefail
          shellcheck --version
          git ls-files -z 'scripts/deploy/*.sh' 'scripts/deploy/*.bash' 'scripts/ci/*.sh' \
            'tests/deploy/*.bash' 'tests/deploy/*.bats' | xargs -0 shellcheck

      - name: shfmt
        run: |
          set -euo pipefail
          git ls-files -z 'scripts/deploy/*.sh' 'scripts/deploy/*.bash' 'scripts/ci/*.sh' \
            'tests/deploy/*.bash' 'tests/deploy/*.bats' | xargs -0 /tmp/shfmt -d -i 2 -ci

      - name: Unit tests (bats)
        # yq (mikefarah v4) and python3-venv come with ubuntu-latest. The schema
        # validation tests install the pinned jsonschema from PyPI.
        run: bats --print-output-on-failure tests/deploy

  release-build:
    name: Release Build (dry run)
    needs: changes
    if: needs.changes.outputs.actions == 'true'
    # Runs code from the PR branch: don't hand it the workflow-level
    # pull-requests: write token.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 2026-07-17
        with:
          persist-credentials: false

      - name: Build release artifacts
        uses: ./.github/actions/build-release-artifacts
        with:
          version: 0.0.0-pre.${{ github.run_number }}

      - name: Check the artifacts exist
        run: |
          set -euo pipefail
          VERSION="0.0.0-pre.${{ github.run_number }}"
          ls -l "teams-notifier-function-app-v${VERSION}.zip" app-requirements.json "teams-app-package-v${VERSION}.tar.gz"
          # Look the entry up by name (exit 11 if absent) rather than piping the listing into
          # `grep -q`, which can SIGPIPE `unzip` under pipefail and fail a good artifact.
          unzip -l "teams-notifier-function-app-v${VERSION}.zip" TeamsNotificationBot.dll >/dev/null

  # Single required status check for branch protection.
  # This replaces requiring each job individually, which breaks when jobs
  # use 'if:' conditions (e.g. dependency-review is PR-only, and others now
  # gate on path filters — they'd otherwise show as pending/skipped).
  # `if: always()` ensures this job runs regardless. Skipped upstream jobs
  # roll up as `success` here.
  conclusion:
    if: always()
    name: CI Conclusion
    needs: [changes, build-and-test, dependency-review, validate, lint-workflows, deploy-tooling, release-build]
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
        if: >-
          ${{
               contains(needs.*.result, 'failure')
            || contains(needs.*.result, 'cancelled')
          }}
