name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # Detect which buckets of files changed in the push / PR. Sibling jobs gate
  # their `if:` on these outputs so we don't waste minutes building, scanning
  # dependencies, or regenerating requirements for a docs- or CI-only change.
  # The `conclusion` job below stays gated on `if: always()` and treats
  # skipped sibling jobs as success, so the required status check is still
  # reported regardless of which jobs ran.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      deps: ${{ steps.filter.outputs.deps }}
      requirements: ${{ steps.filter.outputs.requirements }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6 2026-01-09
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1 2026-03-17
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - '**/*.csproj'
              - 'global.json'
              - 'TeamsNotificationBot.slnx'
              - '.github/workflows/ci.yml'
            deps:
              - '**/*.csproj'
              - 'global.json'
              - '.github/workflows/ci.yml'
            requirements:
              - 'src/**'
              - 'scripts/generate-requirements.sh'
              - 'scripts/validate-requirements.sh'
              - 'teams-app-package/create-teams-app-package.sh'
              - 'teams-app-package/app-metadata.json'
              - '.github/workflows/ci.yml'

  build-and-test:
    name: Build and Test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6 2026-01-09

      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5 2026-02-26
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Get npm global directory
        id: npm-global
        run: echo "dir=$(npm prefix -g)" >> "$GITHUB_OUTPUT"

      - name: Cache Azurite global install
        id: cache-azurite
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5 2026-01-29
        with:
          path: |
            ${{ steps.npm-global.outputs.dir }}/lib/node_modules/azurite
            ${{ steps.npm-global.outputs.dir }}/bin/azurite*
          key: azurite-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}

      # Azurite is intentionally not version-pinned — it floats on whatever
      # npm gives us. If a release breaks (typically: hasn't caught up to a
      # new storage API version used by the .NET SDK), pin here AND in
      # docs/local-development.md AND bake the version into the cache key
      # above together. See CLAUDE.md "Bumping dependencies".
      - name: Install Azurite
        if: steps.cache-azurite.outputs.cache-hit != 'true'
        run: npm install -g azurite

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release -warnAsMessage:xUnit1051

      - name: Test
        run: dotnet test --no-build -c Release --logger GitHubActions

  dependency-review:
    name: Dependency Review
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6 2026-01-09

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5 2026-05-18
        with:
          license-check: false

  validate:
    name: Validate Requirements
    needs: changes
    if: needs.changes.outputs.requirements == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6 2026-01-09

      - name: Regenerate app-requirements.json
        run: bash scripts/generate-requirements.sh

      - name: Check for uncommitted changes
        id: diff-check
        run: |
          if ! git diff --exit-code src/TeamsNotificationBot/app-requirements.json; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            git diff src/TeamsNotificationBot/app-requirements.json > /tmp/requirements-diff.txt
            echo "::error::app-requirements.json is stale — see PR comment for details."
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "app-requirements.json is up to date."
          fi

      - name: Prepare PR comment if stale
        if: steps.diff-check.outputs.stale == 'true' && github.event_name == 'pull_request'
        run: |
          {
            echo '### :x: `app-requirements.json` is out of date'
            echo ''
            echo 'The committed file does not match what `generate-requirements.sh` produces from the current source code. This usually means you changed a queue name, route, auth role, command, or app version but forgot to regenerate.'
            echo ''
            echo '**To fix:**'
            echo '```bash'
            echo 'cd scripts'
            echo 'bash generate-requirements.sh'
            echo '```'
            echo 'Then commit the updated `src/TeamsNotificationBot/app-requirements.json`.'
            echo ''
            echo '<details>'
            echo '<summary>Diff (click to expand)</summary>'
            echo ''
            echo '```diff'
            cat /tmp/requirements-diff.txt
            echo '```'
            echo '</details>'
          } > /tmp/requirements-comment.md

      - name: Post PR comment if stale
        if: steps.diff-check.outputs.stale == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MARKER="<!-- requirements-check -->"
          PR=${{ github.event.pull_request.number }}
          BODY="$(printf '%s\n%s' "$MARKER" "$(cat /tmp/requirements-comment.md)")"
          COMMENT_ID=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --paginate --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -1)
          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" -X PATCH -f body="$BODY"
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$BODY"
          fi

      - name: Remove stale comment if passing
        if: steps.diff-check.outputs.stale == 'false' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MARKER="<!-- requirements-check -->"
          PR=${{ github.event.pull_request.number }}
          COMMENT_ID=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --paginate --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -1)
          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" -X DELETE
          fi

      - name: Fail if stale
        if: steps.diff-check.outputs.stale == 'true'
        run: exit 1

      - name: Validate app-requirements.json
        run: bash scripts/validate-requirements.sh

      - name: Generate a sample Teams app manifest
        # Exercises create-teams-app-package.sh end-to-end with dummy GUIDs
        # so the next step can validate the resulting manifest.json against
        # the live Teams schema. Catches regressions in the script's jq
        # composition (e.g. drift from the schema's allowed properties)
        # before the release-please artifact ships them to consumers.
        run: |
          set -euo pipefail
          mkdir -p /tmp/manifest-ci
          bash teams-app-package/create-teams-app-package.sh \
            --bot-app-id   00000000-aaaa-aaaa-aaaa-aaaaaaaaaaaa \
            --teams-app-id 11111111-bbbb-bbbb-bbbb-bbbbbbbbbbbb \
            --output-dir   /tmp/manifest-ci \
            --dry-run

      - name: Validate the manifest against the Teams app schema
        # Fetches the schema URL from manifest.$schema and validates with
        # Python's jsonschema. Fails the job on any schema error — keeps
        # the manifest in sync with the schema declared in the file itself.
        # If the schema ever introduces a new constraint we violate (or we
        # accidentally add an unknown property), this step trips before the
        # bad ZIP ever reaches a Teams Admin upload.
        run: |
          set -euo pipefail
          SCHEMA_URL=$(jq -r '."$schema"' /tmp/manifest-ci/manifest.json)
          if [ -z "$SCHEMA_URL" ] || [ "$SCHEMA_URL" = "null" ]; then
            echo "::error::manifest.json has no \$schema field; nothing to validate against"
            exit 1
          fi
          curl -fsSL --max-time 15 --retry 3 --retry-delay 2 \
            "$SCHEMA_URL" -o /tmp/teams-schema.json
          # `python3 -m pip` (not bare `pip`) so the installer matches the
          # interpreter the next step uses. `--user` keeps the install out of
          # the system path; `--break-system-packages` is required on
          # ubuntu-latest (PEP 668) — `--user` alone is not enough on the
          # current runner image.
          python3 -m pip install --user --break-system-packages --quiet jsonschema
          python3 - <<'PY'
          import json, sys
          from jsonschema import validators
          schema = json.load(open('/tmp/teams-schema.json'))
          manifest = json.load(open('/tmp/manifest-ci/manifest.json'))
          Validator = validators.validator_for(schema)
          Validator.check_schema(schema)
          errors = sorted(Validator(schema).iter_errors(manifest), key=lambda e: list(e.absolute_path))
          if not errors:
              print('::notice title=Manifest validation::schema-valid against', schema.get('$id', 'Teams schema'))
              sys.exit(0)
          print(f'::error::Teams manifest schema validation failed ({len(errors)} error(s)):')
          for e in errors:
              path = '.'.join(str(p) for p in e.absolute_path) or '<root>'
              print(f'::error::  at {path}: {e.message}')
          sys.exit(1)
          PY

  # Single required status check for branch protection.
  # This replaces requiring each job individually, which breaks when jobs
  # use 'if:' conditions (e.g. dependency-review is PR-only, and others now
  # gate on path filters — they'd otherwise show as pending/skipped).
  # `if: always()` ensures this job runs regardless. Skipped upstream jobs
  # roll up as `success` here.
  conclusion:
    if: always()
    name: CI Conclusion
    needs: [changes, build-and-test, dependency-review, validate]
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
        if: >-
          ${{
               contains(needs.*.result, 'failure')
            || contains(needs.*.result, 'cancelled')
          }}
