# The "Automatic Copilot Code Review" ruleset only fires when the PR author has a
# Copilot seat, so dependabot[bot]-authored PRs silently get no review. This requests
# Copilot explicitly on those PRs.
name: Dependabot Copilot review

on:
  pull_request:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  request-review:
    name: Request Copilot review
    runs-on: ubuntu-latest
    # user.login, not github.actor — the actor can be spoofed into dependabot[bot]
    # via `@dependabot recreate` on a fork PR.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Request Copilot as reviewer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NODE_ID: ${{ github.event.pull_request.node_id }}
        run: |
          # REST requested_reviewers returns 201 but silently drops bot reviewers;
          # only the GraphQL requestReviews mutation with botIds works.
          bot_id=$(gh api 'users/copilot-pull-request-reviewer[bot]' --jq .node_id)
          gh api graphql \
            -f query='mutation($pr: ID!, $bot: ID!) {
              requestReviews(input: {pullRequestId: $pr, botIds: [$bot], union: true}) {
                clientMutationId
              }
            }' -f pr="$PR_NODE_ID" -f bot="$bot_id"
