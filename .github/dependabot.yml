version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    # PR titles become the squash commit subject (squash_merge_commit_title: PR_TITLE),
    # and release-please needs a conventional prefix to produce a patch release.
    commit-message:
      prefix: "fix(deps)"
    groups:
      microsoft-agents:
        patterns:
          - "Microsoft.Agents.*"
      azure-functions:
        patterns:
          - "Microsoft.Azure.Functions.*"
          - "Microsoft.Azure.Core.Extensions"
      azure-sdk:
        patterns:
          - "Azure.*"
      testing:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.*"
          - "coverlet.*"
          - "Moq"
          - "GitHubActionsTestLogger"
    ignore:
      # Incompatible with Functions.Worker.ApplicationInsights 2.x — see docs/contributing.md §9
      - dependency-name: "Microsoft.ApplicationInsights.WorkerService"
        versions: [">=3.0.0"]
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    # "/" only covers .github/workflows; composite actions need their own entry.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "fix(deps)"
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    # The Teams manifest validator that reusable-deploy.yml and CI install with
    # --require-hashes: requirements.in, compiled by pip-compile into requirements.txt.
    # Dependabot re-runs pip-compile with the options in that file's header.
    directory: /scripts/deploy
    schedule:
      interval: weekly
      day: monday
    # The deploy workflow ships with each release, so a bump is a patch release.
    commit-message:
      prefix: "fix(deps)"
    groups:
      deploy-tooling-python:
        patterns:
          - "*"
    open-pull-requests-limit: 5
