version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    # PR titles become the squash commit subject (squash_merge_commit_title: PR_TITLE),
    # and release-please needs a conventional prefix to produce a patch release.
    commit-message:
      prefix: "fix(deps)"
    groups:
      microsoft-agents:
        patterns:
          - "Microsoft.Agents.*"
      azure-functions:
        patterns:
          - "Microsoft.Azure.Functions.*"
          - "Microsoft.Azure.Core.Extensions"
      azure-sdk:
        patterns:
          - "Azure.*"
      testing:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.*"
          - "coverlet.*"
          - "Moq"
          - "GitHubActionsTestLogger"
    ignore:
      # Incompatible with Functions.Worker.ApplicationInsights 2.x — see docs/contributing.md §9
      - dependency-name: "Microsoft.ApplicationInsights.WorkerService"
        versions: [">=3.0.0"]
      # Load-bearing transitive pin for the MSTeams 1.7.4 Graph 5.x stack (GHSA-7j59-v9qr-6fq9);
      # Kiota 2.x pairs with Graph.Core 4.x and would split the stack across majors. Dropping the
      # pin entirely is a hand-verified step — see docs/contributing.md §9.
      - dependency-name: "Microsoft.Kiota.Abstractions"
        versions: [">=2.0.0"]
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "fix(deps)"
    open-pull-requests-limit: 5
