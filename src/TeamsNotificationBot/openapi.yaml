openapi: 3.0.3
info:
  title: Teams Notification Bot API
  description: REST API for sending notifications to Microsoft Teams channels via Azure Bot Service.
  version: 1.0.0
  contact:
    name: Platform Team

servers:
  - url: /api
    description: Azure Functions API prefix

paths:
  /v1/notify/{alias}:
    post:
      operationId: notify
      summary: Send a notification to a Teams channel
      description: |
        Enqueues a text or Adaptive Card message for delivery to the Teams channel
        identified by the alias. Returns 202 immediately; delivery is asynchronous.
      parameters:
        - $ref: '#/components/parameters/alias'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationRequest'
      responses:
        '202':
          description: Message accepted and queued for delivery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
        - bearerAuth: []

  /v1/alert/{alias}:
    post:
      operationId: alert
      summary: Receive an Azure Monitor alert
      description: |
        Accepts a Common Alert Schema payload from Azure Monitor Action Groups,
        transforms it into an Adaptive Card, and enqueues it for delivery.
      parameters:
        - $ref: '#/components/parameters/alias'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommonAlertPayload'
      responses:
        '202':
          description: Alert accepted and queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
        - bearerAuth: []

  /v1/checkin/{alias}:
    post:
      operationId: checkin
      summary: Send a check-in message to a channel
      description: |
        Posts a check-in message (version, timestamp, source) to the specified channel.
        Serves as a connectivity and end-to-end test for the alias.
      parameters:
        - $ref: '#/components/parameters/alias'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                source:
                  type: string
                  description: Identifier for the check-in source
                  example: smoke-test
      responses:
        '202':
          description: Check-in message queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
        - bearerAuth: []

  /v1/send:
    post:
      operationId: send
      summary: Send a notification to a specific target
      description: |
        Enqueues a message for delivery to a specific Teams channel, personal chat,
        or group chat identified by target type and IDs. Returns 202 immediately;
        delivery is asynchronous.
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendRequest'
      responses:
        '202':
          description: Message accepted and queued for delivery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: >-
            update names an unknown or expired message, or one whose conversation the bot no
            longer has
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
        - bearerAuth: []

  /v1/messages/{messageId}:
    get:
      operationId: getMessage
      summary: Get the delivery status of a queued message
      description: |
        What happened to a message the API queued, and where it went. Works for every messageId
        a POST route returned. Records are kept for 180 days by default.
      parameters:
        - name: messageId
          in: path
          required: true
          description: The messageId a POST route returned
          schema:
            type: string
            example: msg-a1b2c3d4e5f67890abcdef1234567890
      responses:
        '200':
          description: The message's delivery status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown or expired messageId
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
        - bearerAuth: []

  /v1/aliases:
    get:
      operationId: getAliases
      summary: List configured channel aliases
      description: Returns all configured channel aliases. Requires DEBUG_MODE=true.
      responses:
        '200':
          description: List of aliases
          content:
            application/json:
              schema:
                type: object
                properties:
                  aliases:
                    type: array
                    items:
                      type: object
                      properties:
                        alias:
                          type: string
                        description:
                          type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
        - bearerAuth: []

  /health:
    get:
      operationId: health
      summary: Health check
      description: Liveness probe. No authentication required.
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  version:
                    type: string
                    example: 1.0.0
                  timestamp:
                    type: string
                    format: date-time
      security: []

  /v1/openapi.yaml:
    get:
      operationId: openapi
      summary: OpenAPI specification
      description: Returns this OpenAPI specification. No authentication required.
      responses:
        '200':
          description: OpenAPI 3.0 YAML specification
          content:
            application/yaml:
              schema:
                type: string
      security: []

components:
  parameters:
    alias:
      name: alias
      in: path
      required: true
      description: Channel alias identifier
      schema:
        type: string
        example: my-channel
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Makes a retry safe. A repeat of a completed request with the same key, from the same
        caller to the same alias or target, returns the original response and queues nothing.
        Keys count for 7 days by default.
      schema:
        type: string
        minLength: 1
        maxLength: 256
        pattern: '^[\x20-\x7E]+$'
        example: deploy-run-42-notification

  schemas:
    NotificationRequest:
      type: object
      required:
        - message
      properties:
        message:
          description: Message content — plain text string or Adaptive Card JSON object
          oneOf:
            - type: string
            - type: object
          example: Hello from the API!
        format:
          type: string
          enum: [text, adaptive-card]
          default: text
          example: text
        metadata:
          $ref: '#/components/schemas/Metadata'
        replyTo:
          type: string
          description: >-
            A messageId from an earlier notify to this alias: post in that message's thread.
            Falls back to a new post if that message was never delivered.
          example: msg-a1b2c3d4e5f67890abcdef1234567890
        update:
          type: string
          description: >-
            A messageId from an earlier notify to this alias: replace that message instead of
            posting. Not together with replyTo.
          example: msg-a1b2c3d4e5f67890abcdef1234567890
        mentions:
          type: array
          maxItems: 30
          description: >-
            People (at most 20) and tags (at most 10) to mention. The message places each one with
            <at>key</at>, at most 30 placements in all; every placement must name a declared key and
            every key must be placed.
            People are checked against the roster before posting and shown under the roster's
            name; one not found is written as plain text and listed in unresolvedMentions. Tags
            only in channels; no mentions in personal chats.
          items:
            $ref: '#/components/schemas/Mention'

    Mention:
      type: object
      required: [key]
      description: A person (id) or a tag (tag), not both.
      properties:
        key:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
          description: What the message's <at>key</at> placements refer to; unique in the array.
          example: merger
        id:
          type: string
          maxLength: 256
          description: A person's Entra object ID (a GUID) or UPN, not their mail address.
          example: jane.doe@example.com
        tag:
          type: string
          maxLength: 512
          description: A tag's ID, as Microsoft Graph returns it. Not checked by the bot.
        name:
          type: string
          minLength: 1
          maxLength: 256
          description: >-
            Required for a tag: its display name. For a person, the plain text shown if they
            aren't in the roster (the id is shown without it). No '<', '>' or control characters.
          example: Jane Doe

    SendRequest:
      type: object
      required:
        - target
        - message
      properties:
        target:
          type: object
          required:
            - type
          properties:
            type:
              type: string
              enum: [channel, personal, groupChat]
              description: Target type
            teamId:
              type: string
              description: >-
                The team's Entra group ID. Required for channel type; for personal type, limits the
                search for the person to this team.
            channelId:
              type: string
              description: Required for channel type
            userId:
              type: string
              maxLength: 256
              description: >-
                Required for personal type: the person's Entra object ID (a GUID) or UPN (not their
                mail address). Found in the roster of a team the bot is installed in; someone in none
                fails the message for good.
              example: jane.doe@example.com
            chatId:
              type: string
              description: Required for groupChat type
        message:
          type: string
          description: Message content — plain text or Adaptive Card JSON string
        format:
          type: string
          enum: [text, adaptive-card]
          default: text
        metadata:
          $ref: '#/components/schemas/Metadata'
        update:
          type: string
          description: >-
            A messageId from an earlier send to the same target: replace that message instead of
            posting. The target's type and IDs must match (userId ignoring case); a personal
            target's teamId isn't compared.
          example: send-a1b2c3d4e5f67890abcdef1234567890

    MessageStatus:
      type: object
      required: [messageId, status, unresolvedMentions, enqueuedAt]
      properties:
        messageId:
          type: string
        status:
          type: string
          enum: [queued, delivered, failed]
        postedAs:
          type: string
          nullable: true
          enum: [post, reply, update]
        target:
          type: object
          nullable: true
          description: The conversation the message went to; null until delivered
          properties:
            type:
              type: string
              enum: [channel, personal, groupChat]
            teamId:
              type: string
              nullable: true
            channelId:
              type: string
              nullable: true
            userId:
              type: string
              nullable: true
            chatId:
              type: string
              nullable: true
        unresolvedMentions:
          type: array
          description: >-
            The id of every mentioned person not found in the roster, and the tag of every tag
            Teams rejected; each was written as plain text.
          items:
            type: string
        enqueuedAt:
          type: string
          format: date-time
        deliveredAt:
          type: string
          format: date-time
          nullable: true
        error:
          type: string
          nullable: true

    Metadata:
      type: object
      maxProperties: 10
      additionalProperties:
        type: string
        maxLength: 256
      description: >-
        Optional key-value pairs for tracing. Logged with the delivery events (as meta.<key>),
        so never put secrets here. At most 10 entries; keys are 1-64 characters of letters,
        digits, '.', '_' and '-'; values are strings of at most 256 characters.

    CommonAlertPayload:
      type: object
      required:
        - schemaId
        - data
      properties:
        schemaId:
          type: string
          enum: [azureMonitorCommonAlertSchema]
        data:
          type: object
          properties:
            essentials:
              type: object
              properties:
                alertRule:
                  type: string
                severity:
                  type: string
                monitorCondition:
                  type: string
                signalType:
                  type: string
            alertContext:
              type: object
            customProperties:
              type: object
              additionalProperties:
                type: string

    AcceptedResponse:
      type: object
      properties:
        status:
          type: string
          example: queued
        messageId:
          type: string
          example: msg-abc123def456
        correlationId:
          type: string
          example: a1b2c3d4e5f6
        timestamp:
          type: string
          format: date-time

    CheckInResponse:
      type: object
      properties:
        status:
          type: string
          example: queued
        messageId:
          type: string
        correlationId:
          type: string
        timestamp:
          type: string
          format: date-time
        version:
          type: string
          example: 1.1.0

    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          example: https://httpstatuses.io/400
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: Invalid JSON payload.
        instance:
          type: string
          example: /api/v1/notify/test
        correlationId:
          type: string

  responses:
    BadRequest:
      description: Bad request — invalid JSON, missing fields, or validation failure
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: >-
        Missing or invalid Bearer token. In Azure this is returned by App Service
        Authentication (EasyAuth) before the request reaches the app: an empty body
        (Content-Length: 0) with WWW-Authenticate: Bearer realm="<host>", and no
        X-Correlation-Id header. The problem+json body
        below is only returned where platform authentication is off, e.g. local
        development.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Access denied (e.g., debug mode disabled)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: >-
        Unknown alias, or an alias whose conversation the bot no longer has (the bot was removed
        from that team or chat); the detail says which
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    PayloadTooLarge:
      description: Request body exceeds 28 KB limit
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnsupportedMediaType:
      description: Content-Type must be application/json
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    IdempotencyConflict:
      description: >-
        Another request with the same Idempotency-Key is still being processed (retry shortly), or
        replyTo/update names a message sent to another alias or target
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    TooManyRequests:
      description: Rate limit exceeded. Retry after the number of seconds specified in the Retry-After header.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Entra ID access token (EasyAuth)
